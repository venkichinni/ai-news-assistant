name: Daily AI News Digest

on:
  schedule:
    # 07:30 UTC = 1:00 PM IST. Adjust to your preferred delivery time.
    - cron: "30 7 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

# Needed so this workflow can commit the updated sent_history.json back to the repo.
permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # sent_history.json is the pipeline's "memory" of what's already been
      # sent. GitHub Actions runners are stateless between runs, so we commit
      # the updated file straight back to the repo after each run.
      - name: Persist sent-history memory
        run: |
          git config user.name "ai-news-assistant-bot"
          git config user.email "actions@github.com"
          git add sent_history.json
          git diff --staged --quiet || git commit -m "Update sent history [skip ci]"
          git push
